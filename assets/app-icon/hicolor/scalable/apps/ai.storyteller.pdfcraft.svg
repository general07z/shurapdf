<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ShuraPDF app icon: a PDF page carrying a domed council chamber, on Bahrain red. Original
       geometric artwork (no fonts, no third-party images); see assets/app-icon/README.md. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3172e"/>
      <stop offset="1" stop-color="#8e0a1c"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <!-- the page, with its shadow and folded corner -->
    <path d="M144 84 H318 L384 150 V432 Q384 452 364 452 H164 Q144 452 144 432 Z" fill="#5c0612" opacity="0.35" transform="translate(6 8)"/>
    <path d="M144 84 H318 L384 150 V432 Q384 452 364 452 H164 Q144 452 144 432 Z" fill="#ffffff"/>
    <path d="M318 84 V134 Q318 150 334 150 H384 Z" fill="#e7d6d8"/>
    <!-- the chamber: dome, finial, drum, columns and steps -->
    <path d="M256 118 L262 136 V162 H250 V136 Z" fill="#c9a227"/>
    <path d="M190 226 A66 66 0 0 1 322 226 Z" fill="#c9a227"/>
    <rect x="178" y="226" width="156" height="16" rx="3" fill="#9e0b1f"/>
    <rect x="190" y="248" width="16" height="58" rx="3" fill="#9e0b1f"/>
    <rect x="226" y="248" width="16" height="58" rx="3" fill="#9e0b1f"/>
    <rect x="270" y="248" width="16" height="58" rx="3" fill="#9e0b1f"/>
    <rect x="306" y="248" width="16" height="58" rx="3" fill="#9e0b1f"/>
    <rect x="170" y="312" width="172" height="12" rx="3" fill="#9e0b1f"/>
    <rect x="160" y="328" width="192" height="10" rx="3" fill="#9e0b1f"/>
    <!-- the PDF label -->
    <rect x="112" y="356" width="288" height="72" rx="16" fill="#5e0612" stroke="#ffffff" stroke-width="4"/>
    <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M201 410 V372 H217 A11 11 0 0 1 217 394 H201"/>
      <path d="M243 372 V410 H251 A19 19 0 0 0 251 372 Z"/>
      <path d="M311 372 H285 V410 M285 391 H305"/>
    </g>
  </g>
</svg>
