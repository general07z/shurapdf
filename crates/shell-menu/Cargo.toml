[package]
name = "pdfcraft-shell-menu"
description = "Windows 11 File Explorer menu entry (IExplorerCommand): Convert to PDF with the app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The workspace forbids `unsafe`. A COM server must export `extern "system"` functions that write
# through raw pointers (DllGetClassObject) and call shell APIs the `windows` crate marks unsafe.
# The owner approved this exception for this crate alone on 2026-11-24 (docs/shura-log.md); every
# `unsafe` block here carries a SAFETY comment. The rest of the workspace keeps `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[features]
# The COM server the DLL exports (package.ps1 builds the DLL with it). Without it the crate is the
# registration and manifest code the app and the CLI use, and exports nothing.
server = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "ApplicationModel", "Foundation", "Foundation_Collections", "Management_Deployment", "System_Profile"] }
windows-core = "0.62"
